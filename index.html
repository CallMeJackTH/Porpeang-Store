<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ร้านเพียงพอ จำลองธุรกิจ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b130e;--wood:#3a2a20;--cream:#f6e8c8;--salmon:#e8a184;--gold:#f6bd4b;--green:#6fc04a;--red:#d65545;--glass:rgba(24,16,12,.62);--line:rgba(255,230,180,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0e0907;overflow:hidden;font-family:Kanit,Sarabun,sans-serif;color:var(--cream)}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#1b120d;touch-action:none}
/* บังคับแนวนอนเสมอ: ถ้าถือจอแนวตั้งจะหมุนเกมให้เอง */
@media (orientation:portrait){#app{inset:auto;top:0;left:100%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg)}}
#fp{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#fp:active{cursor:grabbing}
#vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 52%,rgba(10,5,2,.6) 100%)}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:14px;padding:5px 12px;box-shadow:0 6px 18px #0006}
#mny{font-weight:600;font-size:clamp(17px,3.6vh,24px);color:var(--gold);line-height:1.15}
.sub{font-size:clamp(11px,2.2vh,13px);color:var(--salmon)}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#dayp{text-align:center;display:flex;gap:10px;align-items:baseline}
#day{font-size:clamp(14px,3vh,19px);font-weight:600}
#evc{display:none;font-size:clamp(11px,2.3vh,14px);max-width:min(52vw,430px);text-align:center;background:rgba(246,189,75,.16);border-color:rgba(246,189,75,.55)}
#tools{display:flex;gap:4px;padding:4px}
.ib{width:clamp(30px,6vh,38px);height:clamp(30px,6vh,38px);border:0;border-radius:10px;background:rgba(255,255,255,.09);color:var(--cream);font-size:clamp(15px,3vh,19px)}
.ib:active{background:rgba(255,255,255,.2)}
@keyframes up{0%{transform:scale(1.18);color:#9dff7a}100%{transform:none}}
@keyframes dn{0%{transform:scale(1.12);color:#ff8a78}100%{transform:none}}
#mny.up{animation:up .7s}#mny.dn{animation:dn .7s}
/* dock */
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 8px 22px #0007;z-index:6}
.dk{display:flex;flex-direction:column;align-items:center;gap:0;min-width:clamp(54px,9vw,74px);padding:4px 6px 5px;border:0;border-radius:13px;background:rgba(255,255,255,.08);color:var(--cream);font-weight:500;font-size:clamp(10px,2.2vh,12.5px);line-height:1.15}
.dk b{font-size:clamp(18px,4.2vh,26px);font-weight:400;line-height:1.2}
.dk:active{transform:translateY(2px);background:rgba(255,255,255,.18)}
.dk.go{background:linear-gradient(#86d85f,#4c9a32);color:#10230a;font-weight:600}
/* order card */
#order{position:absolute;right:calc(14px + env(safe-area-inset-right));top:50%;transform:translate(140%,-50%);transition:transform .38s cubic-bezier(.2,.9,.3,1.15);width:clamp(210px,29vw,272px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 #0006,0 16px 30px #0007;padding:10px 12px 12px;z-index:7;font-family:Sarabun,Kanit,sans-serif}
#order.show{transform:translate(0,-50%)}
#order:before{content:"";position:absolute;left:-14px;top:42%;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
.oh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.oe{font-size:clamp(30px,7vh,44px);background:#fff;border:2.5px solid var(--ink);border-radius:14px;width:clamp(46px,10vh,62px);height:clamp(46px,10vh,62px);display:flex;align-items:center;justify-content:center}
.oh b{font:600 clamp(15px,3.2vh,19px) Kanit}
.ot{font-size:12px;opacity:.7}
.orow{display:flex;justify-content:space-between;font-size:clamp(13px,2.6vh,15px);padding:2px 0;border-bottom:2px dashed #3a2a2040}
.ok{color:#2c8a2c}.bad{color:#c0392b}
.warn{font-size:12.5px;background:#ffe1d6;border:2px solid #c0392b;border-radius:8px;padding:3px 7px;margin-top:5px}
.obt{display:flex;gap:8px;margin-top:9px}.obt .bt{flex:1;padding:7px 4px}
.bt{font:600 clamp(13px,2.8vh,15px) Kanit;border:2.5px solid var(--ink);border-radius:11px;padding:7px 14px;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.bt.g{background:var(--green)}.bt.r{background:var(--red);color:#fff}
.bt:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.bt:disabled{opacity:.4;pointer-events:none}
/* pricing */
#pricing{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(58px + env(safe-area-inset-top));bottom:calc(150px + env(safe-area-inset-bottom));width:clamp(250px,36vw,330px);transform:translateX(-130%);transition:transform .32s cubic-bezier(.2,.9,.3,1);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;overflow:auto;z-index:6;box-shadow:0 10px 26px #0008;touch-action:pan-y}
#pricing.show{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--gold);font-size:16px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.pn{display:flex;gap:8px;align-items:center}.pn .em{font-size:24px}
.pn b{font-weight:500;font-size:14px;display:block}.pn small{font-size:11.5px;opacity:.75}
.pc{display:flex;align-items:center;gap:5px}
.pc .sq{width:28px;height:28px;border-radius:8px;border:0;background:var(--gold);color:var(--ink);font-weight:600;font-size:17px;line-height:1}
.pc .sq:active{transform:scale(.9)}
.pv{min-width:28px;text-align:center;font-weight:600;font-size:15px}
.pc em{font-style:normal;font-size:11.5px;min-width:26px;text-align:right}
#pricing .ok{color:#8be06a}#pricing .bad{color:#ff8e7d}
/* toast + hint */
#toast{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-14px);opacity:0;transition:.3s;background:rgba(246,232,200,.96);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:6px 16px;font-weight:500;font-size:clamp(13px,2.8vh,16px);z-index:9;pointer-events:none;box-shadow:0 6px 0 #0005;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(84px + env(safe-area-inset-bottom));font-size:12px;opacity:.75;transition:opacity 1s;pointer-events:none;text-shadow:0 1px 4px #000;display:none}
/* modal */
#md{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:10px;z-index:20}
#mc{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 #0006;padding:12px 16px 14px;max-width:500px;width:100%;max-height:94%;overflow:auto;font-family:Sarabun,sans-serif;touch-action:pan-y}
#mc h2{margin:0 0 6px;font:600 clamp(18px,4vh,23px) Kanit;color:#5a3a22}
#mc p{margin:6px 0}
#mc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:2px dashed #3a2a2040;font-size:14.5px}
#mc input{width:100%;padding:8px 10px;margin:4px 0;border:2.5px solid var(--ink);border-radius:10px;font:16px Sarabun,sans-serif;background:#fffaf0;-webkit-user-select:text;user-select:text}
.hint{font-size:13px;opacity:.75}
.mb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#night{position:absolute;inset:0;background:#05030a;opacity:0;pointer-events:none;transition:opacity .55s;z-index:30;display:flex;align-items:center;justify-content:center;font:600 clamp(22px,6vh,34px) Kanit;color:var(--gold)}
#night.on{opacity:1;pointer-events:auto}
.mx{position:sticky;top:0;float:right;z-index:3;width:34px;height:34px;border-radius:10px;border:2.5px solid var(--ink);background:var(--red);color:#fff;font:600 16px Kanit;line-height:1;margin:-4px -6px 0 6px;box-shadow:0 3px 0 var(--ink)}
#mc.pm{max-width:330px;padding:8px 10px 10px}
.phone .row{padding:3px 0!important;font-size:12.5px!important}.phone .bt{padding:3px 8px!important;font-size:12px!important}.phone h2{font-size:16px!important}
.tabs button,.chips button{padding:5px 2px!important;font-size:12px!important}.phone .hint{font-size:11px}.phone .ps{margin-right:40px}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.plot{aspect-ratio:1;border:2.5px solid var(--ink);border-radius:10px;background:#8a5a30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:#fff;font-family:Kanit;line-height:1.1;cursor:pointer}
.plot small{font-size:10px}.plot.g{background:#6a4a2a;cursor:default}.plot.r{background:#4c9a32}
.sd{flex:1;border:2.5px solid var(--ink);border-radius:10px;padding:5px;background:#fffaf0;font:500 13px Kanit;color:var(--ink)}.sd.on{background:var(--gold)}.sd small{font-size:10.5px;opacity:.75}
/* จอยสติ๊กเดิน */
#joy{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:clamp(96px,26vh,128px);height:clamp(96px,26vh,128px);border-radius:50%;background:rgba(255,255,255,.08);border:2px solid var(--line);z-index:5;touch-action:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold));box-shadow:0 4px 10px #0007;pointer-events:none}
#joy:after{content:"เดิน";position:absolute;left:0;right:0;top:-18px;text-align:center;font-size:11px;opacity:.7}
/* การ์ดโทรศัพท์เข้า */
#call{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(56px + env(safe-area-inset-top));width:clamp(230px,34vw,290px);transform:translateX(-130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.15);background:linear-gradient(#1c2230,#10141d);border:3px solid #05070b;border-radius:26px;box-shadow:0 12px 30px #000a,inset 0 0 0 2px #3a4560;padding:12px 14px 14px;z-index:12;color:#eaf1ff;font-family:Sarabun,Kanit,sans-serif;max-height:calc(100% - 140px);overflow:auto}
#call.show{transform:none}
#call.ring{animation:shk .5s infinite}
@keyframes shk{0%,100%{rotate:0deg}20%{rotate:-2deg}40%{rotate:2deg}60%{rotate:-1.5deg}80%{rotate:1.5deg}}
.cav{width:54px;height:54px;border-radius:50%;background:#2b3550;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 4px}
.cn{text-align:center;font:600 16px Kanit}.cs{text-align:center;font-size:12px;opacity:.7;margin-bottom:6px}
.ctx{font-size:14px;background:#1e2740;border-radius:12px;padding:8px 10px;margin:6px 0;line-height:1.4}
.cb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.cb .bt{flex:1;min-width:90px;font-size:13px;padding:7px 6px}
.rv{font-size:12.5px;border-radius:8px;padding:4px 8px;margin-top:6px;font-weight:600}
.rv.s{background:#5a1f1a;color:#ffb4a8}.rv.n{background:#1d4a2b;color:#a8f0b8}
/* แอปมือถือ (นำเข้า/ส่งออก) */
.phone{background:linear-gradient(#1c2230,#10141d);color:#eaf1ff;border-radius:22px;padding:10px 12px 12px;margin:-4px}
.phone h2{color:#ffe9a8!important;margin:2px 0 6px!important}
.ps{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-bottom:4px}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button,.chips button{flex:1;border:0;border-radius:10px;padding:7px 4px;background:#2b3550;color:#eaf1ff;font:500 13px Kanit}
.tabs button.on{background:var(--gold);color:var(--ink);font-weight:600}.chips{display:flex;gap:6px;margin-bottom:6px}.chips button.on{background:#4c7be0}
.phone .row{border-bottom:1px dashed #3a4560!important;color:#eaf1ff}
.phone .row small{opacity:.7}.phone .bt{padding:5px 9px;font-size:13px}

/* === ตั้งราคา/แอป/โทร เลื่อนด้วยนิ้วได้ (เลื่อนด้วย JS รองรับโหมดหมุนจอ) === */
#pricing,#mc,#call{touch-action:none;overscroll-behavior:contain}
/* === การ์ดโทรเข้า สไตล์ iPhone (เล็ก) === */
#call{width:clamp(196px,25vw,228px);padding:12px 12px 14px;border-radius:24px;border:1.5px solid rgba(255,255,255,.18);background:linear-gradient(165deg,#4b1d3b,#2b1b47 58%,#1a1533);box-shadow:0 12px 30px #000a;color:#fff}
#call .cav{width:44px;height:44px;font-size:24px;background:rgba(255,255,255,.14)}
#call .cn{font:400 clamp(16px,3.4vh,20px) Kanit}
#call .cs{opacity:.75}
#call .ctx{background:rgba(255,255,255,.12);font-size:12.5px;color:#fff}
#call .cb{justify-content:center}
#call .cb .bt{border:0;border-radius:999px;box-shadow:none;color:#fff;background:#34c759;font-size:12.5px;min-width:80px}
#call .cb .bt.r{background:#ff3b30}
#call .cb .bt:not(.g):not(.r){background:rgba(255,255,255,.2)}
#call .cb .bt:disabled{opacity:.4}
#call .cb.rg{justify-content:space-around;margin-top:14px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
#call .rb .bt{width:46px;height:46px;min-width:0;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
/* === ปุ่มทำงานในฟาร์ม === */
#act{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;align-items:stretch;z-index:6;max-width:46vw}
#act .bt{padding:8px 12px}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}.shk{animation:shk .38s}
/* ===== เมนูหลัก / ปุ่มต่อย / ล็อกเมาส์ ===== */
#mm{position:absolute;inset:0;z-index:15;display:none;align-items:center;overflow:auto;padding:10px calc(5vw + env(safe-area-inset-right)) 10px calc(5vw + env(safe-area-inset-left));background:linear-gradient(90deg,rgba(18,10,6,.95) 0,rgba(18,10,6,.8) 42%,rgba(18,10,6,.28) 100%);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#mm.on{display:flex}
#mp{width:clamp(250px,40vw,380px);display:flex;flex-direction:column;gap:clamp(8px,2vh,14px);margin:auto 0}
#mp h1{margin:0;font:600 clamp(34px,10vh,60px)/1.05 Kanit;color:var(--cream);text-shadow:0 4px 0 #0008}
#mp .tg{margin:0 0 clamp(6px,2vh,16px);font-size:clamp(13px,2.8vh,16px);color:var(--salmon)}
.mbn{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:clamp(8px,2vh,13px) 18px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);color:var(--ink);font:600 clamp(18px,4.4vh,24px) Kanit;text-align:left;box-shadow:0 5px 0 var(--ink)}
.mbn small{font:500 clamp(11px,2.4vh,14px) Sarabun,sans-serif;opacity:.7}
.mbn.pl{background:var(--green)}
.mbn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.mbn:focus-visible,.bt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.mcard{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 #0006;padding:12px 16px 14px;font-family:Sarabun,sans-serif}
.mcard h2{margin:0 0 6px;font:600 clamp(20px,4.6vh,26px) Kanit;color:#5a3a22}
.mcard h2 small{font:500 13px Sarabun,sans-serif;opacity:.65;margin-left:6px}
.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed #3a2a2040;font-size:14.5px}
.mcard .row span:last-child{text-align:right}
.mcard .hint{margin:8px 0 0}
.stp{display:flex;align-items:center;gap:8px}
.stp b{min-width:46px;text-align:center;font:600 16px Kanit}
.stp button,.tgl{min-width:36px;height:34px;border:2.5px solid var(--ink);border-radius:10px;background:var(--gold);color:var(--ink);font:600 16px Kanit;box-shadow:0 3px 0 var(--ink)}
.stp button:active,.tgl:active{transform:translateY(3px);box-shadow:none}
.tgl{padding:0 14px;font-size:14px}.tgl.on{background:var(--green)}
#pbtn{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:clamp(56px,15vh,70px);height:clamp(56px,15vh,70px);padding:0;display:none;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 35% 28%,#f2897a,var(--red) 62%);color:#fff;font:600 clamp(10px,2.2vh,12px)/1 Kanit;box-shadow:0 5px 0 var(--ink),0 10px 20px #0007;z-index:6;touch-action:none}
#pbtn b{font-size:clamp(22px,6vh,30px);font-weight:400;line-height:1.1}
#pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#pbtn.on{display:flex}
#xh{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,240,200,.92);box-shadow:0 0 0 1.5px rgba(20,10,5,.7);pointer-events:none;display:none;z-index:4}
#app.ml #xh{display:block}
#app.ml #fp{cursor:none}
/* ===== ส่วนเสริมออนไลน์ (สไตล์เดียวกับเกมเดิม) ===== */
.mrow{display:flex;gap:8px}
.mbn.sm{flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:0;width:auto;padding:clamp(6px,1.6vh,10px) 4px;font-size:clamp(17px,4.2vh,24px);line-height:1.1;text-align:center}
.mbn.sm span{font:600 clamp(10px,2.3vh,13px) Kanit;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#fffaf0 center/cover no-repeat;flex:none;display:inline-block}
.who{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rk{min-width:34px;font:600 15px Kanit}
.row.me{background:rgba(246,189,75,.35);border-radius:8px}
#mc .row small{opacity:.7;font-size:11.5px}
.code{font:600 clamp(28px,7vh,40px) Kanit;letter-spacing:.18em;text-align:center;background:#fffaf0;border:2.5px dashed var(--ink);border-radius:12px;padding:6px 0 6px .18em;margin:8px 0}
.dot{width:9px;height:9px;border-radius:50%;background:#9a9a9a;display:inline-block;flex:none}.dot.on{background:var(--green)}
#mc input.cd{text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:600}
#lbl{max-height:58vh}
/* ===== หน้าเข้าสู่เกมด้วยชื่อผู้เล่น ===== */
#lg{position:absolute;inset:0;z-index:40;display:none;padding:10px calc(5vw + env(safe-area-inset-right)) 10px calc(5vw + env(safe-area-inset-left));background:radial-gradient(ellipse at 25% 15%,#46291a,#0e0907 70%);overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}

#lgw .br{flex:1 1 230px;min-width:0}
#lgw h1{margin:0;font:600 clamp(32px,9vh,58px)/1.05 Kanit;color:var(--cream);text-shadow:0 4px 0 #0008}
#lgw .tg{margin:6px 0 0;font-size:clamp(13px,2.8vh,16px);color:var(--salmon)}
#lgc{flex:1 1 290px;min-width:0;max-width:410px}
@media (max-height:420px){#lgw .tg{display:none}#lgw .br{flex-basis:170px}}
.lgtabs{display:flex;gap:6px;margin:4px 0 8px}
.lgtabs button{flex:1;padding:6px 4px;border:2.5px solid var(--ink);border-radius:10px;background:#fffaf0;color:var(--ink);font:600 14px Kanit;box-shadow:0 3px 0 var(--ink)}
.lgtabs button.on{background:var(--gold)}
.lgl{display:block;margin-top:6px;font:500 13.5px Kanit;color:#5a3a22}
.lgi{width:100%;padding:8px 10px;margin:3px 0;border:2.5px solid var(--ink);border-radius:10px;font:16px Sarabun,sans-serif;background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
.lgi:focus{outline:3px solid var(--gold);outline-offset:1px}
.lgi:disabled{opacity:.55}
.lgh{font-size:12px;opacity:.7;min-height:16px}.lgh.bad{color:#b3261e;opacity:1}
.lgpw{position:relative}.lgpw .lgi{padding-right:44px}
.lgeye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:32px;border:0;background:transparent;font-size:18px}
.lgd{margin-top:6px;font-size:13px}.lgd summary{cursor:pointer;opacity:.8}
.lgb{width:100%;padding:11px 14px;font-size:clamp(16px,3.4vh,19px)}
.spin{width:26px;height:26px;margin:10px auto 4px;border:4px solid #3a2a2040;border-top-color:var(--ink);border-radius:50%;animation:lgs .8s linear infinite}
@keyframes lgs{to{transform:rotate(360deg)}}

 if(v=='menu'){p.innerHTML=`<div class="mcard"><h2>Menu<small>เมนู</small></h2><div class="row"><span>🕹 จอย / WASD</span><span>เดิน</span></div><div class="row"><span>ลากหน้าจอ / เมาส์</span><span>มองรอบ</span></div><div class="row"><span>V (PC)</span><span>ล็อก / ปลดล็อกเมาส์</span></div><div class="row"><span>👊 ปุ่ม Punch</span><span>ต่อยคนที่อยู่ตรงหน้า</span></div><div class="row"><span>💎 เศรษฐี</span><span>มาทุก 7 วัน และวันที่ 30</span></div><div class="mb"><button class="bt g" onclick="fs()">⛶ เต็มจอ</button><button class="bt r" onclick="askReset()">↺ เริ่มเกมใหม่</button><button class="bt" onclick="mmView('main')">‹ Back</button></div></div>`;return}
 p.innerHTML=`<h1>ร้านเพียงพอ</h1><p class="tg">จำลองธุรกิจร้านโชห่วย</p><button class="mbn pl" onclick="mmPlay()">Play<small>${started||S.d>1?'เล่นต่อ':'เริ่มเล่น'}</small></button><button class="mbn" onclick="mmView('set')">Settings<small>ตั้งค่า</small></button><button class="mbn" onclick="mmView('menu')">Menu<small>เมนู</small></button>${window.CLX?CLX.menuBtns():''}`}
function cfgSens(d){CFG.sens=Math.round(Math.max(.4,Math.min(2.5,CFG.sens+d))*10)/10;cfgSave();$('sv').textContent=CFG.sens.toFixed(1)+'×'}

 if(!started){started=true;nextCall(22000);const h=$('hint');h.style.display='block';h.style.opacity=.75;setTimeout(()=>{h.style.opacity=0},9000);setTimeout(()=>toast('ยินดีต้อนรับสู่ร้านเพียงพอ 🏪'),300)}else nextCall(8000)}
setInterval(()=>{const on=!paused&&!inF;if(on!==pbOn){pbOn=on;$('pbtn').classList.toggle('on',on)}},120);
/* เริ่มเกม */
hud();sz();loop();mmOpen();

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Cloud / Multiplayer / Leaderboard (Supabase) — ต่อเติมจากเกมเดิม ไม่แก้ UI เดิม ===== */
(function(){
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=u=>{u=String(u||'');return /^https:\/\/[^\s'")]+$/.test(u)?`style="background-image:url('${esc(encodeURI(u))}')"`:''};
const ERR={unauthorized:'กรุณาเข้าสู่ระบบอีกครั้ง',not_found:'ไม่พบห้อง หรือห้องหมดอายุแล้ว',full:'ห้องเต็ม (สูงสุด 4 คน)',bad_code:'รหัสห้องต้องมี 6 ตัวอักษร',missing_env:'ยังไม่ได้ตั้งค่า Supabase บนเซิร์ฟเวอร์',net:'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'};
const em=e=>ERR[e&&e.code]||'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';

let sb=null,cfg=null,user=null,token='',ready=false,booting=null;
const X=window.CLX={};

/* ---------- เชื่อมต่อ Supabase (ค่าอ่านจาก Vercel env ผ่าน /api/config) ---------- */
async function boot(){
  if(sb)return true;
  if(booting)return booting;
  booting=(async()=>{
    try{
      if(!window.supabase)throw new Error('sdk');
      const r=await fetch('/api/config',{cache:'no-store'});
      if(!r.ok)throw new Error('cfg');
      cfg=await r.json();
      sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:12}}});
      sb.auth.onAuthStateChange((ev,sess)=>{token=sess?sess.access_token:'';setTimeout(()=>authChanged(ev,sess),0)});
      const {data}=await sb.auth.getSession();
      if(data&&data.session){token=data.session.access_token;authChanged('INITIAL_SESSION',data.session)}
      lbSubscribe();
      return true;
    }catch(e){sb=null;booting=null;return false}
  })();
  return booting;
}
async function api(path,opt){
  const h={'Content-Type':'application/json'};
  try{const s=sb&&(await sb.auth.getSession()).data.session;if(s){h.Authorization='Bearer '+s.access_token;token=s.access_token}}catch(e){}
  let r;try{r=await fetch(path,Object.assign({headers:h,cache:'no-store'},opt||{}))}catch(e){throw Object.assign(new Error('net'),{code:'net'})}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||'http'),{code:j.error||'http',status:r.status,data:j});
  return j}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});

/* ---------- เข้าสู่เกมด้วยชื่อผู้เล่น (Username Login) ---------- */
let loggedUid='',player=null,logging=0;
function authChanged(ev,sess){
  if(sess&&sess.user){
    user=sess.user;
    if(loggedUid!==user.id||!player||!player.claimed){loggedUid=user.id;onLogin()}
    else refreshMenu();
  }else if(loggedUid){loggedUid='';user=null;player=null;ready=false;clearInterval(tmr);mpLeave(true);refreshMenu();mpRender();mmOpen();lgShow('login')}
}
const LGE={bad_login:'ชื่อผู้เล่นหรือรหัสผ่านไม่ถูกต้อง (ถ้าเป็นผู้เล่นใหม่ ให้เลือกแท็บ "ผู้เล่นใหม่")',username_taken:'ชื่อผู้เล่นนี้ถูกใช้แล้ว ลองชื่ออื่น',bad_username:'ชื่อผู้เล่นไม่ถูกต้อง (3–20 ตัว ใช้ A–Z 0–9 _ เท่านั้น)',bad_password:'รหัสผ่านต้องยาว 6–72 ตัวอักษร',mismatch:'รหัสผ่านทั้งสองช่องไม่ตรงกัน',rate_limited:'ลองบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่',bad_claim:'รหัสย้ายข้อมูลไม่ถูกต้องหรือหมดอายุแล้ว',schema_missing:'ฐานข้อมูลยังไม่มีตารางสำหรับระบบสมาชิก กรุณาตั้งค่า Migration 001 ใน Supabase',database_error:'ระบบฐานข้อมูลสมาชิกขัดข้อง กรุณาตรวจสอบ Supabase แล้วลองใหม่',auth_error:'Supabase Auth ไม่สามารถสร้างบัญชีได้ กรุณาตรวจสอบการตั้งค่า Auth',net:ERR.net,missing_env:ERR.missing_env,server:'เซิร์ฟเวอร์สมัครสมาชิกขัดข้อง กรุณาตรวจสอบ Vercel Runtime Logs'};
const lg={mode:'status',u:'',busy:0,msg:'',retry:null};
const vName=v=>!v?'กรุณากรอกชื่อผู้เล่น':(v.length<3||v.length>20)?'ชื่อผู้เล่นต้องยาว 3–20 ตัวอักษร':!/^[A-Za-z0-9_]+$/.test(v)?'ใช้ได้เฉพาะ A–Z, 0–9 และ _ เท่านั้น':'';
const vPass=v=>!v?'กรุณากรอกรหัสผ่าน':v.length<6?'รหัสผ่านอย่างน้อย 6 ตัวอักษร':v.length>72?'รหัสผ่านยาวเกินไป':'';
function lgShow(mode,err){lg.mode=mode;lg.msg=err||'';lg.busy=0;lg.retry=null;$('lg').classList.add('on');lgRender()}
function lgStatus(msg,retry){lg.mode='status';lg.msg=msg;lg.busy=0;lg.retry=retry||null;$('lg').classList.add('on');lgRender()}
function lgHide(){$('lg').classList.remove('on')}
function lgRender(){
  const c=$('lgc');if(!c)return;
  if(lg.mode==='status'){
    c.innerHTML=`<div class="mcard"><h2>ร้านเพียงพอ<small>ผู้เล่น</small></h2><p class="hint" style="font-size:14px;opacity:1">${esc(lg.msg)}</p>${lg.retry?'<div class="mb"><button class="bt g" onclick="CLX.lgRetry()">ลองใหม่</button></div>':'<div class="spin"></div>'}</div>`;return}
  const reg=lg.mode!=='login',claim=lg.mode==='claim';
  c.innerHTML=`<div class="mcard"><h2>${claim?'ย้ายข้อมูลเดิม':'เข้าสู่เกม'}<small>${claim?'ตั้งชื่อผู้เล่น':'Username Login'}</small></h2>`+
  (claim?'<p class="hint">ระบบเปลี่ยนจาก Google เป็นชื่อผู้เล่นแล้ว ตั้งชื่อและรหัสผ่านใหม่ ข้อมูลเกมเดิม (เงิน ทรัพย์สิน ธุรกิจ) จะอยู่ครบ</p>':
   `<div class="lgtabs"><button class="${reg?'':'on'}" onclick="CLX.lgMode('login')">เคยเล่นแล้ว</button><button class="${reg?'on':''}" onclick="CLX.lgMode('register')">ผู้เล่นใหม่</button></div>`)+
  `<label class="lgl" for="lgu">ชื่อผู้เล่น (Username)</label>
  <input id="lgu" class="lgi" maxlength="20" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="เช่น Somchai_01" value="${esc(lg.u)}" oninput="CLX.lgIn()" onkeydown="if(event.key==='Enter')CLX.lgGo()">
  <div class="lgh" id="lgh">3–20 ตัว · ใช้ A–Z, 0–9 และ _ · ห้ามซ้ำกับคนอื่น</div>
  <label class="lgl" for="lgp">รหัสผ่าน</label>
  <div class="lgpw"><input id="lgp" type="password" class="lgi" maxlength="72" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'อย่างน้อย 6 ตัวอักษร':'รหัสผ่านของคุณ'}" onkeydown="if(event.key==='Enter')CLX.lgGo()"><button type="button" class="lgeye" aria-label="แสดง/ซ่อนรหัสผ่าน" onclick="CLX.lgEye()">👁</button></div>`+
  (reg?`<label class="lgl" for="lgp2">ยืนยันรหัสผ่าน</label><input id="lgp2" type="password" class="lgi" maxlength="72" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านอีกครั้ง" onkeydown="if(event.key==='Enter')CLX.lgGo()">`:'')+
  (lg.mode==='register'?`<details class="lgd"><summary>มีรหัสย้ายข้อมูลเดิมจากแอดมิน?</summary><input id="lgcc" class="lgi" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="รหัสย้ายข้อมูล" onkeydown="if(event.key==='Enter')CLX.lgGo()"></details>`:'')+
  `<div class="warn" id="lge" style="display:${lg.msg?'block':'none'}" role="alert">${esc(lg.msg)}</div>
  <div class="mb"><button class="bt g lgb" id="lgb" onclick="CLX.lgGo()">เข้าเล่นเกม</button></div>
  <p class="hint lgf" style="font-size:11.5px">รหัสผ่านถูกเข้ารหัสบนเซิร์ฟเวอร์ ไม่ถูกเก็บไว้ในเครื่อง</p></div>`;
}
function lgErr(m){lg.msg=m||'';const e=$('lge');if(e){e.textContent=lg.msg;e.style.display=lg.msg?'block':'none'}}
function lgBusy(b){
  lg.busy=b?1:0;
  ['lgu','lgp','lgp2','lgcc'].forEach(i=>{const e=$(i);if(e)e.disabled=!!b});
  const t=$('lgb');if(t){t.disabled=!!b;t.textContent=b?'⏳ กำลังเข้าสู่ระบบ…':'เข้าเล่นเกม'}
}
X.lgMode=function(m){if(lg.busy)return;const u=$('lgu');if(u)lg.u=u.value;lg.mode=m;lg.msg='';lgRender()};
X.lgIn=function(){const u=$('lgu'),h=$('lgh');if(!u||!h)return;lg.u=u.value;const e=u.value?vName(u.value.trim()):'';h.classList.toggle('bad',!!e);h.textContent=e||'3–20 ตัว · ใช้ A–Z, 0–9 และ _ · ห้ามซ้ำกับคนอื่น'};
X.lgEye=function(){['lgp','lgp2'].forEach(i=>{const e=$(i);if(e)e.type=e.type==='password'?'text':'password'})};
X.lgRetry=function(){if(lg.retry)lg.retry()};
async function signIn(u,p){
  const {error}=await sb.auth.signInWithPassword({email:u.toLowerCase()+'@'+((cfg&&cfg.emailDomain)||'players.porpeang.app'),password:p});
  if(error){const s=error.status;throw{code:s===429?'rate_limited':(s===400||s===401||s===422)?'bad_login':'net'}}
}
X.lgGo=async function(){
  if(lg.busy)return;                                  // กันกดซ้ำ
  const u=(($('lgu')||{}).value||'').trim(),p=($('lgp')||{}).value||'',reg=lg.mode!=='login';
  let e=vName(u);
  if(!e)e=reg?vPass(p):(p?'':'กรุณากรอกรหัสผ่าน');
  if(!e&&reg&&p!==(($('lgp2')||{}).value||''))e=LGE.mismatch;
  if(e){lgErr(e);return}
  lg.u=u;lgBusy(1);lgErr('');
  let ok=false,created=false;
  try{
    if(!(await boot()))throw{code:'net'};
    if(reg){
      const cc=lg.mode==='register'&&$('lgcc')?$('lgcc').value:'';
      await post('/api/register',{username:u,password:p,claimCode:cc});   // เซิร์ฟเวอร์ตรวจกฎ+ความซ้ำอีกครั้ง
      created=true;
    }
    await signIn(u,p);
    ok=true;
  }catch(er){
    if(created){lg.mode='login';lgRender();lgErr('สร้างผู้เล่นแล้ว แต่เข้าสู่ระบบไม่สำเร็จ ลองกด "เข้าเล่นเกม" อีกครั้ง');return}
    lgErr(LGE[er&&er.code]||LGE.server);
  }
  ['lgp','lgp2','lgcc'].forEach(i=>{const x=$(i);if(x)x.value=''});   // ไม่ค้างรหัสผ่านในหน้าจอ
  if(ok)lgStatus('กำลังโหลดข้อมูลของคุณ…');else lgBusy(0);
};
X.login=function(){if(!user)lgShow('login');else lgHide()};
X.logout=function(){
  md(`<h2>ออกจากระบบ?</h2><p>ระบบจะเซฟข้อมูลขึ้นคลาวด์ก่อนออกจากระบบ</p><div class="mb"><button class="bt r" onclick="CLX.logout2()">ออกจากระบบ</button><button class="bt" onclick="cl()">ยกเลิก</button></div>`)};
X.logout2=async function(){
  cl();await flush(true);
  try{await sb.auth.signOut()}catch(e){}
  ls('ppuid','');ls('ppss','');applyState(fresh());
  loggedUid='';user=null;player=null;ready=false;clearInterval(tmr);mpLeave(true);
  lg.u='';mmOpen();lgShow('login');
};
X.switchAcc=X.logout2;

/* ---------- เซฟคลาวด์ ---------- */
function applyState(st){
  S=Object.assign(fresh(),st);S.farm=1;S.nest=S.nest||[];S.hens=S.hens||0;S.coop=S.coop||0;S.plots=S.plots||Array(8).fill(null);S.emp=S.emp||null;S.wv=S.wv||0;S.tr=S.tr||{d:S.d,v:{}};
  I.forEach(i=>{if(S.st[i.k]==null)S.st[i.k]=5;if(S.pr[i.k]==null)S.pr[i.k]=i.p});
  pm=S.m;cu=null;lv=[];FL=[];if(ca)endCall();inF=false;setFbtn();$('act').style.display='none';CAM[0]=0;CAM[2]=.2;hud();spawn();lastHash=''}
let lastHash='',saving=0,again=0,resetFlag=0,errT=0,lastSaved=0,tmr=0;
async function restore(){
  try{
    const r=await api('/api/save');
    const foreign=ls('ppuid')&&ls('ppuid')!==user.id;
    const cs=r.save&&r.save.state;
    if(r.save&&r.save.settings){const t=r.save.settings;if(t.sens)CFG.sens=Math.max(.4,Math.min(2.5,+t.sens||1));CFG.inv=t.inv?1:0;cfgSave()}
    ls('ppuid',user.id);
    if(cs){
      const hasLocal=!foreign&&(S.d>1||S.sold>0)&&(cs.m!==S.m||cs.d!==S.d);
      if(hasLocal){
        ready=false;lgHide();
        md(`<h2>☁ พบข้อมูลบนคลาวด์</h2><div class="row"><span>☁ คลาวด์</span><span>วันที่ ${cs.d} · ${B(cs.m)}</span></div><div class="row"><span>📱 ในเครื่อง</span><span>วันที่ ${S.d} · ${B(S.m)}</span></div><p class="hint">เลือกข้อมูลที่ต้องการใช้ต่อ</p><div class="mb"><button class="bt g" onclick="CLX.pick(1)">ใช้ข้อมูลคลาวด์</button><button class="bt" onclick="CLX.pick(0)">ใช้ข้อมูลในเครื่อง</button></div>`);
        X._cs=cs;
        return;
      }
      applyState(cs);
    }else if(foreign){applyState(fresh())}
    ready=true;
    start();
  }catch(e){ready=false;lgStatus('โหลดข้อมูลผู้เล่นไม่สำเร็จ กำลังลองใหม่อัตโนมัติ…');setTimeout(()=>{if(user&&!ready)restore()},8000)}
}
X.pick=function(useCloud){cl();if(useCloud)applyState(X._cs);else resetFlag=1;ready=true;start();flush(true)};
function start(){
  lgHide();clearInterval(tmr);tmr=setInterval(()=>flush(false),15000);
  flush(true);mpRestore();lbRefresh();refreshMenu();
  toast('☁ ยินดีต้อนรับ '+player.username+' · เซฟอัตโนมัติ');
}
async function flush(force,keep){
  if(!sb||!user||!ready)return;
  const body=JSON.stringify({state:S,settings:{sens:CFG.sens,inv:CFG.inv},reset:resetFlag?1:0});
  const h=body.length+'|'+JSON.stringify(S);
  if(!force&&h===lastHash)return;
  if(keep){try{fetch('/api/save',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body})}catch(e){}return}
  if(saving){again=1;return}
  saving=1;
  try{
    const j=await post('/api/save',{state:S,settings:{sens:CFG.sens,inv:CFG.inv},reset:resetFlag?1:0});
    lastHash=h;resetFlag=0;lastSaved=Date.now();errT=0;
    if(j.clamped&&j.state){applyState(j.state);toast('⚠️ เซิร์ฟเวอร์ปรับยอดเงินให้อยู่ในช่วงที่เป็นไปได้')}
  }catch(e){
    if(Date.now()-errT>60000){errT=Date.now();toast('☁ เซฟขึ้นคลาวด์ไม่สำเร็จ จะลองใหม่อัตโนมัติ')}
  }
  saving=0;if(again){again=0;flush(false)}
}
async function onLogin(){
  if(logging)return;logging=1;ready=false;
  try{
    const j=await api('/api/me');                       // Player ID มาจาก JWT ที่เซิร์ฟเวอร์ตรวจแล้วเท่านั้น
    player=j.player;
    if(!player.claimed){lgShow('claim');return}         // บัญชี Google เดิม: ต้องตั้งชื่อ+รหัสผ่านก่อน
    refreshMenu();
    lgStatus('กำลังโหลดข้อมูลของคุณ…');
    await restore();
  }catch(e){
    if(e&&e.code==='unauthorized'){
      try{await sb.auth.signOut()}catch(_){}

/* ---------- Multiplayer ---------- */
const MP={room:null,members:[],ch:null,online:{},peers:{},feed:[],st:'off',bo:0,rt:0,connTimer:0,connSeq:0,lastPos:0,lastSig:'',lastTrack:'',busy:0,msg:''};
const ST=()=>({id:user.id,name:me().name,avatar:me().avatar,money:Math.round(S.m),day:S.d,f:inF?1:0,ev:S.ev?S.ev.t:''});
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)};
const lookOf=id=>{const h=hash(id);return{c:SH[h%SH.length],s:SK[(h>>3)%SK.length],p:PN[(h>>5)%PN.length],h:HR[(h>>7)%HR.length]}};
function peerOf(id){let p=MP.peers[id];if(!p)p=MP.peers[id]={id,x:0,z:0,tx:0,tz:0,f:0,m:0,walk:0,seen:0,init:0,L:lookOf(id),name:'Player'};return p}
async function mpRestore(){try{const j=await api('/api/room?action=current');if(j.room)mpEnter(j.room,j.members)}catch(e){}}
function mpEnter(room,members){MP.room=room;MP.members=members||[];ls('ppr2',room.code);mpConnect();mpRender()}
function mpConnect(){
  mpDrop();
  if(!sb||!user||!MP.room)return;
  const seq=MP.connSeq,code=MP.room.code;
  MP.st='connecting';MP.msg='';mpRender();
  (async()=>{
    try{
      // Explicitly pass the current signed-in user's JWT to Supabase Realtime.
      const sessionResult=await sb.auth.getSession();
      const accessToken=sessionResult&&sessionResult.data&&sessionResult.data.session&&sessionResult.data.session.access_token;
      if(!accessToken)throw new Error('missing_realtime_session');
      await sb.realtime.setAuth(accessToken);
      if(seq!==MP.connSeq||!MP.room||MP.room.code!==code)return;

      const ch=sb.channel('room:'+code,{config:{private:true,broadcast:{self:false},presence:{key:user.id}}});
      ch.on('broadcast',{event:'pos'},({payload})=>{if(!payload||payload.id===user.id)return;const p=peerOf(payload.id);p.tx=+payload.x||0;p.tz=+payload.z||0;p.f=payload.f?1:0;p.m=payload.m?1:0;p.seen=Date.now();if(!p.init){p.x=p.tx;p.z=p.tz;p.init=1}})
        .on('broadcast',{event:'act'},({payload})=>onAct(payload))
        .on('presence',{event:'sync'},onSync)
        .on('presence',{event:'join'},()=>refreshMembers())
        .on('presence',{event:'leave'},()=>refreshMembers());

      MP.ch=ch;
      // Do not leave the UI stuck on "connecting" if Realtime never responds.
      MP.connTimer=setTimeout(()=>{
        if(MP.ch!==ch||MP.st!=='connecting')return;
        MP.st='retry';
        MP.msg='เชื่อมต่อห้องไม่สำเร็จ กรุณาตรวจสอบว่าได้รัน supabase/fix_room_realtime.sql แล้ว';
        try{sb.removeChannel(ch)}catch(e){}
        MP.ch=null;mpRender();mpRetry();
      },12000);

      ch.subscribe(status=>{
        if(MP.ch!==ch)return;
        if(status==='SUBSCRIBED'){
          clearTimeout(MP.connTimer);MP.connTimer=0;
          MP.st='on';MP.bo=0;MP.msg='';MP.lastTrack='';
          trackNow(true);refreshMembers();mpRender();
        }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
          clearTimeout(MP.connTimer);MP.connTimer=0;
          MP.st='retry';
          MP.msg='เชื่อมต่อห้องไม่สำเร็จ ('+status+') ตรวจสอบ Realtime และ SQL สำหรับสิทธิ์สมาชิกห้อง';
          mpRender();mpRetry();
        }
      });
    }catch(error){
      if(seq!==MP.connSeq)return;
      clearTimeout(MP.connTimer);MP.connTimer=0;
      MP.st='retry';
      MP.msg='ตั้งค่าการเชื่อมต่อห้องไม่สำเร็จ กรุณาเข้าสู่ระบบใหม่และตรวจสอบ Realtime SQL';
      mpRender();mpRetry();
    }
  })();
}
function mpDrop(){
  clearTimeout(MP.rt);clearTimeout(MP.connTimer);MP.connTimer=0;MP.connSeq++;
  if(MP.ch){try{sb.removeChannel(MP.ch)}catch(e){}MP.ch=null}
  MP.online={};MP.peers={}
}
function mpRetry(){clearTimeout(MP.rt);MP.bo=Math.min(MP.bo+1,6);MP.rt=setTimeout(async()=>{if(!MP.room)return;await mpCheck(true)},Math.min(30000,1000*Math.pow(2,MP.bo)))}
async function mpCheck(force){
  if(!user||!sb)return;
  try{
    const j=await api('/api/room?action=current');
    if(!j.room){if(MP.room){mpLeave(true);toast('👥 ห้องหมดอายุแล้ว');mpRender()}return}
    if(!MP.room||MP.room.code!==j.room.code){MP.room=j.room;MP.members=j.members;mpConnect()}
    else{MP.members=j.members;if(force||MP.st!=='on')mpConnect()}
    mpRender();
  }catch(e){if(MP.room){MP.st='retry';mpRender();mpRetry()}}
}
setInterval(()=>{if(MP.room)mpCheck()},60000);
function onSync(){
  if(!MP.ch)return;const s=MP.ch.presenceState(),o={};
  Object.keys(s).forEach(k=>{if(s[k]&&s[k][0])o[k]=s[k][0]});
  MP.online=o;Object.keys(MP.peers).forEach(k=>{if(!o[k])delete MP.peers[k]});
  Object.keys(o).forEach(k=>{if(k!==user.id){const p=peerOf(k);p.name=o[k].name||p.name}});
  mpRender();
}
let rmT=0;
function refreshMembers(){clearTimeout(rmT);rmT=setTimeout(async()=>{if(!MP.room)return;try{const j=await api('/api/room?action=members');MP.members=j.members;mpRender()}catch(e){}},500)}
function trackNow(force){
  if(!MP.ch||MP.st!=='on')return;
  const s=ST(),sig=s.money+'|'+s.day+'|'+s.f+'|'+s.ev;
  if(!force&&sig===MP.lastTrack)return;MP.lastTrack=sig;
  try{MP.ch.track(s)}catch(e){}
}
setInterval(()=>trackNow(false),3000);
setInterval(()=>{

  const n=Date.now(),sig=CAM[0].toFixed(2)+'|'+CAM[2].toFixed(2)+'|'+(inF?1:0)+'|'+(mvAmt>.1?1:0);

  try{MP.ch.send({type:'broadcast',event:'pos',payload:{id:user.id,x:+CAM[0].toFixed(2),z:+CAM[2].toFixed(2),f:inF?1:0,m:mvAmt>.1?1:0}})}catch(e){}
},140);
function act(kind,val){if(!MP.ch||MP.st!=='on')return;try{MP.ch.send({type:'broadcast',event:'act',payload:{id:user.id,k:kind,v:val||0,x:CAM[0],z:CAM[2],f:inF?1:0}})}catch(e){}}
const ACT={sell:v=>'ขายได้ +'+B(v),punch:()=>'ต่อยลูกค้า 👊',harvest:()=>'เก็บเกี่ยวผลผลิต 🧺'};
function onAct(p){
  if(!p||!ACT[p.k])return;
  const o=MP.online[p.id],nm=(o&&o.name)||(MP.members.find(m=>m.id===p.id)||{}).name||'เพื่อน';
  MP.feed.unshift({n:nm,t:ACT[p.k](p.v)});MP.feed.length=Math.min(MP.feed.length,6);
  const pe=MP.peers[p.id];
  if(pe&&(pe.f?1:0)===(inF?1:0)){const s=p.k=='sell'?'+'+B(p.v):p.k=='punch'?'💥 โป๊ก!':'🧺';FL.push({x:pe.x,y:1.9,z:pe.z,t:0,s})}
  mpRender();
}

{

/* วาดผู้เล่นอื่นในฉากเดิม (ใช้ตัวละคร man() เดิม) */
let lt2=0;
window.MPD=function(f){
  const ids=Object.keys(MP.peers);if(!ids.length)return;
  const n=performance.now(),dt=Math.min(.1,(n-lt2)/1000||0);lt2=n;
  for(const id of ids){const p=MP.peers[id];if(!p.init||(p.f?1:0)!==f)continue;
    const dx=p.tx-p.x,dz=p.tz-p.z,k=Math.min(1,dt*10);p.x+=dx*k;p.z+=dz*k;
    if(Math.hypot(dx,dz)>.04)p.walk+=dt*9;
    man(p.x,p.z,{walk:p.walk,ax:Math.abs(dx)>Math.abs(dz),L:p.L,face:false})}
};
window.MPT=function(f){
  for(const id in MP.peers){const p=MP.peers[id];if(!p.init||(p.f?1:0)!==f)continue;

};
