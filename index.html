<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ร้านเพียงพอ จำลองธุรกิจ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b130e;--wood:#3a2a20;--cream:#f6e8c8;--salmon:#e8a184;--gold:#f6bd4b;--green:#6fc04a;--red:#d65545;--glass:rgba(24,16,12,.62);--line:rgba(255,230,180,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0e0907;overflow:hidden;font-family:Kanit,Sarabun,sans-serif;color:var(--cream)}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#1b120d;touch-action:none}
/* บังคับแนวนอนเสมอ: ถ้าถือจอแนวตั้งจะหมุนเกมให้เอง */
@media (orientation:portrait){#app{inset:auto;top:0;left:100%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg)}}
#fp{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#fp:active{cursor:grabbing}
#vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 52%,rgba(10,5,2,.6) 100%)}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:14px;padding:5px 12px;box-shadow:0 6px 18px #0006}
#mny{font-weight:600;font-size:clamp(17px,3.6vh,24px);color:var(--gold);line-height:1.15}
.sub{font-size:clamp(11px,2.2vh,13px);color:var(--salmon)}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#dayp{text-align:center;display:flex;gap:10px;align-items:baseline}
#day{font-size:clamp(14px,3vh,19px);font-weight:600}
#evc{display:none;font-size:clamp(11px,2.3vh,14px);max-width:min(52vw,430px);text-align:center;background:rgba(246,189,75,.16);border-color:rgba(246,189,75,.55)}
#tools{display:flex;gap:4px;padding:4px}
.ib{width:clamp(30px,6vh,38px);height:clamp(30px,6vh,38px);border:0;border-radius:10px;background:rgba(255,255,255,.09);color:var(--cream);font-size:clamp(15px,3vh,19px)}
.ib:active{background:rgba(255,255,255,.2)}
@keyframes up{0%{transform:scale(1.18);color:#9dff7a}100%{transform:none}}
@keyframes dn{0%{transform:scale(1.12);color:#ff8a78}100%{transform:none}}
#mny.up{animation:up .7s}#mny.dn{animation:dn .7s}
/* dock */
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 8px 22px #0007;z-index:6}
.dk{display:flex;flex-direction:column;align-items:center;gap:0;min-width:clamp(54px,9vw,74px);padding:4px 6px 5px;border:0;border-radius:13px;background:rgba(255,255,255,.08);color:var(--cream);font-weight:500;font-size:clamp(10px,2.2vh,12.5px);line-height:1.15}
.dk b{font-size:clamp(18px,4.2vh,26px);font-weight:400;line-height:1.2}
.dk:active{transform:translateY(2px);background:rgba(255,255,255,.18)}
.dk.go{background:linear-gradient(#86d85f,#4c9a32);color:#10230a;font-weight:600}
/* order card */
#order{position:absolute;right:calc(14px + env(safe-area-inset-right));top:50%;transform:translate(140%,-50%);transition:transform .38s cubic-bezier(.2,.9,.3,1.15);width:clamp(210px,29vw,272px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 #0006,0 16px 30px #0007;padding:10px 12px 12px;z-index:7;font-family:Sarabun,Kanit,sans-serif}
#order.show{transform:translate(0,-50%)}
#order:before{content:"";position:absolute;left:-14px;top:42%;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
.oh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.oe{font-size:clamp(30px,7vh,44px);background:#fff;border:2.5px solid var(--ink);border-radius:14px;width:clamp(46px,10vh,62px);height:clamp(46px,10vh,62px);display:flex;align-items:center;justify-content:center}
.oh b{font:600 clamp(15px,3.2vh,19px) Kanit}
.ot{font-size:12px;opacity:.7}
.orow{display:flex;justify-content:space-between;font-size:clamp(13px,2.6vh,15px);padding:2px 0;border-bottom:2px dashed #3a2a2040}
.ok{color:#2c8a2c}.bad{color:#c0392b}
.warn{font-size:12.5px;background:#ffe1d6;border:2px solid #c0392b;border-radius:8px;padding:3px 7px;margin-top:5px}
.obt{display:flex;gap:8px;margin-top:9px}.obt .bt{flex:1;padding:7px 4px}
.bt{font:600 clamp(13px,2.8vh,15px) Kanit;border:2.5px solid var(--ink);border-radius:11px;padding:7px 14px;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.bt.g{background:var(--green)}.bt.r{background:var(--red);color:#fff}
.bt:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.bt:disabled{opacity:.4;pointer-events:none}
/* pricing */
#pricing{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(58px + env(safe-area-inset-top));bottom:calc(150px + env(safe-area-inset-bottom));width:clamp(250px,36vw,330px);transform:translateX(-130%);transition:transform .32s cubic-bezier(.2,.9,.3,1);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;overflow:auto;z-index:6;box-shadow:0 10px 26px #0008;touch-action:pan-y}
#pricing.show{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--gold);font-size:16px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.pn{display:flex;gap:8px;align-items:center}.pn .em{font-size:24px}
.pn b{font-weight:500;font-size:14px;display:block}.pn small{font-size:11.5px;opacity:.75}
.pc{display:flex;align-items:center;gap:5px}
.pc .sq{width:28px;height:28px;border-radius:8px;border:0;background:var(--gold);color:var(--ink);font-weight:600;font-size:17px;line-height:1}
.pc .sq:active{transform:scale(.9)}
.pv{min-width:28px;text-align:center;font-weight:600;font-size:15px}
.pc em{font-style:normal;font-size:11.5px;min-width:26px;text-align:right}
#pricing .ok{color:#8be06a}#pricing .bad{color:#ff8e7d}
/* toast + hint */
#toast{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-14px);opacity:0;transition:.3s;background:rgba(246,232,200,.96);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:6px 16px;font-weight:500;font-size:clamp(13px,2.8vh,16px);z-index:9;pointer-events:none;box-shadow:0 6px 0 #0005;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(84px + env(safe-area-inset-bottom));font-size:12px;opacity:.75;transition:opacity 1s;pointer-events:none;text-shadow:0 1px 4px #000;display:none}
/* modal */
#md{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:10px;z-index:20}
#mc{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 #0006;padding:12px 16px 14px;max-width:500px;width:100%;max-height:94%;overflow:auto;font-family:Sarabun,sans-serif;touch-action:pan-y}
#mc h2{margin:0 0 6px;font:600 clamp(18px,4vh,23px) Kanit;color:#5a3a22}
#mc p{margin:6px 0}
#mc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:2px dashed #3a2a2040;font-size:14.5px}
#mc input{width:100%;padding:8px 10px;margin:4px 0;border:2.5px solid var(--ink);border-radius:10px;font:16px Sarabun,sans-serif;background:#fffaf0;-webkit-user-select:text;user-select:text}
.hint{font-size:13px;opacity:.75}
.mb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#night{position:absolute;inset:0;background:#05030a;opacity:0;pointer-events:none;transition:opacity .55s;z-index:30;display:flex;align-items:center;justify-content:center;font:600 clamp(22px,6vh,34px) Kanit;color:var(--gold)}
#night.on{opacity:1;pointer-events:auto}
.mx{position:sticky;top:0;float:right;z-index:3;width:34px;height:34px;border-radius:10px;border:2.5px solid var(--ink);background:var(--red);color:#fff;font:600 16px Kanit;line-height:1;margin:-4px -6px 0 6px;box-shadow:0 3px 0 var(--ink)}
#mc.pm{max-width:330px;padding:8px 10px 10px}
.phone .row{padding:3px 0!important;font-size:12.5px!important}.phone .bt{padding:3px 8px!important;font-size:12px!important}.phone h2{font-size:16px!important}
.tabs button,.chips button{padding:5px 2px!important;font-size:12px!important}.phone .hint{font-size:11px}.phone .ps{margin-right:40px}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.plot{aspect-ratio:1;border:2.5px solid var(--ink);border-radius:10px;background:#8a5a30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:#fff;font-family:Kanit;line-height:1.1;cursor:pointer}
.plot small{font-size:10px}.plot.g{background:#6a4a2a;cursor:default}.plot.r{background:#4c9a32}
.sd{flex:1;border:2.5px solid var(--ink);border-radius:10px;padding:5px;background:#fffaf0;font:500 13px Kanit;color:var(--ink)}.sd.on{background:var(--gold)}.sd small{font-size:10.5px;opacity:.75}
/* จอยสติ๊กเดิน */
#joy{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:clamp(96px,26vh,128px);height:clamp(96px,26vh,128px);border-radius:50%;background:rgba(255,255,255,.08);border:2px solid var(--line);z-index:5;touch-action:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold));box-shadow:0 4px 10px #0007;pointer-events:none}
#joy:after{content:"เดิน";position:absolute;left:0;right:0;top:-18px;text-align:center;font-size:11px;opacity:.7}
/* การ์ดโทรศัพท์เข้า */
#call{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(56px + env(safe-area-inset-top));width:clamp(230px,34vw,290px);transform:translateX(-130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.15);background:linear-gradient(#1c2230,#10141d);border:3px solid #05070b;border-radius:26px;box-shadow:0 12px 30px #000a,inset 0 0 0 2px #3a4560;padding:12px 14px 14px;z-index:12;color:#eaf1ff;font-family:Sarabun,Kanit,sans-serif;max-height:calc(100% - 140px);overflow:auto}
#call.show{transform:none}
#call.ring{animation:shk .5s infinite}
@keyframes shk{0%,100%{rotate:0deg}20%{rotate:-2deg}40%{rotate:2deg}60%{rotate:-1.5deg}80%{rotate:1.5deg}}
.cav{width:54px;height:54px;border-radius:50%;background:#2b3550;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 4px}
.cn{text-align:center;font:600 16px Kanit}.cs{text-align:center;font-size:12px;opacity:.7;margin-bottom:6px}
.ctx{font-size:14px;background:#1e2740;border-radius:12px;padding:8px 10px;margin:6px 0;line-height:1.4}
.cb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.cb .bt{flex:1;min-width:90px;font-size:13px;padding:7px 6px}
.rv{font-size:12.5px;border-radius:8px;padding:4px 8px;margin-top:6px;font-weight:600}
.rv.s{background:#5a1f1a;color:#ffb4a8}.rv.n{background:#1d4a2b;color:#a8f0b8}
/* แอปมือถือ (นำเข้า/ส่งออก) */
.phone{background:linear-gradient(#1c2230,#10141d);color:#eaf1ff;border-radius:22px;padding:10px 12px 12px;margin:-4px}
.phone h2{color:#ffe9a8!important;margin:2px 0 6px!important}
.ps{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-bottom:4px}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button,.chips button{flex:1;border:0;border-radius:10px;padding:7px 4px;background:#2b3550;color:#eaf1ff;font:500 13px Kanit}
.tabs button.on{background:var(--gold);color:var(--ink);font-weight:600}.chips{display:flex;gap:6px;margin-bottom:6px}.chips button.on{background:#4c7be0}
.phone .row{border-bottom:1px dashed #3a4560!important;color:#eaf1ff}
.phone .row small{opacity:.7}.phone .bt{padding:5px 9px;font-size:13px}

/* === ตั้งราคา/แอป/โทร เลื่อนด้วยนิ้วได้ (เลื่อนด้วย JS รองรับโหมดหมุนจอ) === */
#pricing,#mc,#call{touch-action:none;overscroll-behavior:contain}
/* === การ์ดโทรเข้า สไตล์ iPhone (เล็ก) === */
#call{width:clamp(196px,25vw,228px);padding:12px 12px 14px;border-radius:24px;border:1.5px solid rgba(255,255,255,.18);background:linear-gradient(165deg,#4b1d3b,#2b1b47 58%,#1a1533);box-shadow:0 12px 30px #000a;color:#fff}
#call .cav{width:44px;height:44px;font-size:24px;background:rgba(255,255,255,.14)}
#call .cn{font:400 clamp(16px,3.4vh,20px) Kanit}
#call .cs{opacity:.75}
#call .ctx{background:rgba(255,255,255,.12);font-size:12.5px;color:#fff}
#call .cb{justify-content:center}
#call .cb .bt{border:0;border-radius:999px;box-shadow:none;color:#fff;background:#34c759;font-size:12.5px;min-width:80px}
#call .cb .bt.r{background:#ff3b30}
#call .cb .bt:not(.g):not(.r){background:rgba(255,255,255,.2)}
#call .cb .bt:disabled{opacity:.4}
#call .cb.rg{justify-content:space-around;margin-top:14px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
#call .rb .bt{width:46px;height:46px;min-width:0;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
/* === ปุ่มทำงานในฟาร์ม === */
#act{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;align-items:stretch;z-index:6;max-width:46vw}
#act .bt{padding:8px 12px}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}.shk{animation:shk .38s}
/* ===== เมนูหลัก / ปุ่มต่อย / ล็อกเมาส์ ===== */
#mm{position:absolute;inset:0;z-index:15;display:none;align-items:center;overflow:auto;padding:10px calc(5vw + env(safe-area-inset-right)) 10px calc(5vw + env(safe-area-inset-left));background:linear-gradient(90deg,rgba(18,10,6,.95) 0,rgba(18,10,6,.8) 42%,rgba(18,10,6,.28) 100%);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#mm.on{display:flex}
#mp{width:clamp(250px,40vw,380px);display:flex;flex-direction:column;gap:clamp(8px,2vh,14px);margin:auto 0}
#mp h1{margin:0;font:600 clamp(34px,10vh,60px)/1.05 Kanit;color:var(--cream);text-shadow:0 4px 0 #0008}
#mp .tg{margin:0 0 clamp(6px,2vh,16px);font-size:clamp(13px,2.8vh,16px);color:var(--salmon)}
.mbn{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:clamp(8px,2vh,13px) 18px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);color:var(--ink);font:600 clamp(18px,4.4vh,24px) Kanit;text-align:left;box-shadow:0 5px 0 var(--ink)}
.mbn small{font:500 clamp(11px,2.4vh,14px) Sarabun,sans-serif;opacity:.7}
.mbn.pl{background:var(--green)}
.mbn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.mbn:focus-visible,.bt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.mcard{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 #0006;padding:12px 16px 14px;font-family:Sarabun,sans-serif}
.mcard h2{margin:0 0 6px;font:600 clamp(20px,4.6vh,26px) Kanit;color:#5a3a22}
.mcard h2 small{font:500 13px Sarabun,sans-serif;opacity:.65;margin-left:6px}
.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed #3a2a2040;font-size:14.5px}
.mcard .row span:last-child{text-align:right}
.mcard .hint{margin:8px 0 0}
.stp{display:flex;align-items:center;gap:8px}
.stp b{min-width:46px;text-align:center;font:600 16px Kanit}
.stp button,.tgl{min-width:36px;height:34px;border:2.5px solid var(--ink);border-radius:10px;background:var(--gold);color:var(--ink);font:600 16px Kanit;box-shadow:0 3px 0 var(--ink)}
.stp button:active,.tgl:active{transform:translateY(3px);box-shadow:none}
.tgl{padding:0 14px;font-size:14px}.tgl.on{background:var(--green)}
#pbtn{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:clamp(56px,15vh,70px);height:clamp(56px,15vh,70px);padding:0;display:none;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 35% 28%,#f2897a,var(--red) 62%);color:#fff;font:600 clamp(10px,2.2vh,12px)/1 Kanit;box-shadow:0 5px 0 var(--ink),0 10px 20px #0007;z-index:6;touch-action:none}
#pbtn b{font-size:clamp(22px,6vh,30px);font-weight:400;line-height:1.1}
#pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#pbtn.on{display:flex}
#xh{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,240,200,.92);box-shadow:0 0 0 1.5px rgba(20,10,5,.7);pointer-events:none;display:none;z-index:4}
#app.ml #xh{display:block}
#app.ml #fp{cursor:none}
/* ===== ส่วนเสริมออนไลน์ (สไตล์เดียวกับเกมเดิม) ===== */
.mrow{display:flex;gap:8px}
.mbn.sm{flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:0;width:auto;padding:clamp(6px,1.6vh,10px) 4px;font-size:clamp(17px,4.2vh,24px);line-height:1.1;text-align:center}
.mbn.sm span{font:600 clamp(10px,2.3vh,13px) Kanit;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#fffaf0 center/cover no-repeat;flex:none;display:inline-block}
.who{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rk{min-width:34px;font:600 15px Kanit}
.row.me{background:rgba(246,189,75,.35);border-radius:8px}
#mc .row small{opacity:.7;font-size:11.5px}
.code{font:600 clamp(28px,7vh,40px) Kanit;letter-spacing:.18em;text-align:center;background:#fffaf0;border:2.5px dashed var(--ink);border-radius:12px;padding:6px 0 6px .18em;margin:8px 0}
.dot{width:9px;height:9px;border-radius:50%;background:#9a9a9a;display:inline-block;flex:none}.dot.on{background:var(--green)}
#mc input.cd{text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:600}
#lbl{max-height:58vh}
/* ===== หน้าเข้าสู่เกมด้วยชื่อผู้เล่น ===== */
#lg{position:absolute;inset:0;z-index:40;display:none;padding:10px calc(5vw + env(safe-area-inset-right)) 10px calc(5vw + env(safe-area-inset-left));background:radial-gradient(ellipse at 25% 15%,#46291a,#0e0907 70%);overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#lg.on{display:flex}
#lgw{display:flex;flex-wrap:wrap;gap:clamp(10px,3vh,28px) clamp(16px,4vw,48px);align-items:center;justify-content:center;width:100%;max-width:860px;margin:auto}
#lgw .br{flex:1 1 230px;min-width:0}
#lgw h1{margin:0;font:600 clamp(32px,9vh,58px)/1.05 Kanit;color:var(--cream);text-shadow:0 4px 0 #0008}
#lgw .tg{margin:6px 0 0;font-size:clamp(13px,2.8vh,16px);color:var(--salmon)}
#lgc{flex:1 1 290px;min-width:0;max-width:410px}
@media (max-height:420px){#lgw .tg{display:none}#lgw .br{flex-basis:170px}}
.lgtabs{display:flex;gap:6px;margin:4px 0 8px}
.lgtabs button{flex:1;padding:6px 4px;border:2.5px solid var(--ink);border-radius:10px;background:#fffaf0;color:var(--ink);font:600 14px Kanit;box-shadow:0 3px 0 var(--ink)}
.lgtabs button.on{background:var(--gold)}
.lgl{display:block;margin-top:6px;font:500 13.5px Kanit;color:#5a3a22}
